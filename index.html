<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Time Pitch Tracker</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>

    <div id="start-overlay" class="overlay">
        <h1>Pitch Tracker</h1>
        <p>A pure Javascript adaptation of the <a href="https://github.com/groupmm/real_time_swipe" target="_blank">RT-SWIPE</a> algorithm.</p>
        <button id="start-btn">Allow Microphone &amp; Start</button>
        <div id="loading">Initializing Background Worker...</div>
    </div>

    <div id="ui" class="hidden">
        <canvas id="viz-layer"></canvas>
        <div id="info">
            <div id="note">--</div>
            <div id="freq">Waiting for audio...</div>
        </div>
    </div>

    <script src="index.js"></script>
</body>
</html>
